name: Bug report
description: Something does not work, or the app crashed or vanished.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please include the log from Spotidark's last run:

        - Linux: `~/.local/state/spotidark/spotidark.log`
        - macOS: `~/Library/Application Support/engineering.darkroom.spotidark/spotidark.log`
        - Windows: `%LOCALAPPDATA%\darkroom\spotidark\data\spotidark.log`

        If the app crashed or vanished, include `panic.log` from the same folder.
  - type: input
    id: version
    attributes:
      label: Spotidark version and how you installed it
      description: The release version you downloaded, or the commit for a source build.
      placeholder: "0.8.123 from the DMG / the Windows installer / built from source at commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: System details
      description: Distribution and desktop on Linux, or the OS version.
      placeholder: "Arch, Hyprland, PipeWire / macOS 15.6 / Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Spotify plan
      options:
        - Premium
        - Free
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened instead?
      placeholder: "1. Signed in. 2. Pressed play on a playlist. 3. Nothing played; the button kept spinning."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: spotidark.log
      description: Reproduce the problem, quit the app, then paste the whole file here (and panic.log, if there is one). Paths are above.
      render: text
    validations:
      required: true
