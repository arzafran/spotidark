title: Spotidark
description: A native Spotify client for macOS, Windows, and Linux by Darkroom Engineering, based on Spotifast.
lang: en-US
timezone: Europe/Berlin
baseurl: ""
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - Spotify client
        - Rust
        - egui
        - librespot
        - Spotify Connect
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: The app showing a playlist with the queue open and a track playing
    publisher:
      type: Organization
      name: Darkroom Engineering
      url: https://github.com/darkroomengineering
      same_as:
        - https://github.com/darkroomengineering/spotidark
  llms:
    title: Spotidark
    description: >-
      Documentation for Spotidark, a native Spotify client for macOS, Windows,
      and Linux. It covers local playback, library access, and Spotify
      Connect.
    full: true
    details: >-
      Covers installation, sign-in, everyday use, settings, and Spotify
      connections. Source is on
      [GitHub](https://github.com/darkroomengineering/spotidark).
  branding:
    site_title: Spotidark
    logo:
      default: /assets/images/logo.svg
      alt: Spotidark
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Spotidark is maintained by <a href="https://github.com/darkroomengineering" target="_blank" rel="noreferrer">Darkroom Engineering</a>.
      It is a fork of <a href="https://github.com/crmne/spotifast" target="_blank" rel="noreferrer">Spotifast</a> by Carmine Paolino and contributors (MIT).
    copyright: >-
      Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. Spotidark is an independent fork, not affiliated with or endorsed by Spotify AB or the Spotifast team. Spotify is a trademark of Spotify AB.
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/darkroomengineering/spotidark/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: darkroomengineering/spotidark
    text: Star
    show_count: true

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
